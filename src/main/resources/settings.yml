debug: false

general:
  language: "english" # Valid options: "czech", "english", "french", "german", "jpn_JP", "korean", "ru-RU", "zh-CN", and "zh-TW".

  update-checker:
    enabled: true # Check for updates.
    interval: 24h # Minimum: 10m. Supports s (seconds), m (minutes), h (hours), and d (days).

  auto-update:
    settings: true # Update settings.yml to remove deprecated settings and add new settings.
    paper-config: true # Update paper-global.yml to disable block updates for custom blocks.

  introduction:
    enabled: true # Set to false to suppress the first-run welcome message.
    console-sent: false # Internal flag; set to true after the welcome message has been shown.

  formatting: # Uses MiniMessage formatting; legacy colors such as §c and &c are not supported.
    inventory-titles: true # Format inventory titles made by any plugin.
    titles: true # Format titles made by any plugin.
    subtitles: true # Format subtitles made by any plugin.
    action-bar: true # Format action bars made by any plugin.
    anvil: true # Format the result item's text in anvils.
    signs: true # Format sign text when placed or edited.
    chat: true # Format text and glyphs in chat. Disable if this conflicts with your chat plugin.
    books: true # Format glyphs in books.

configuration:
  defaults:
    assets: true # Generate default assets.
    configs: true # Generate default configs.

  items:
    model-data:
      skipped-numbers: [] # Numbers or ranges, such as 1-4, skipped by automatic assignment.
      disable-automatic: false # Disable automatic model data assignment.

    fallback:
      material: PODZOL
      exclude-from-inventory: false # Hide the fallback item from the inventory menu.
      inject-id: false

glyphs:
  emoji-list-permission-only: true # Only list emojis the player has permission to use.
  unicode-completions: true # Use Unicode characters instead of glyph placeholders in tab completions.
  disable-automatic-code: false # Disable automatic glyph code assignment.

custom-armor:
  type: COMPONENT # Valid options: COMPONENT, TRIMS, and NONE.
  auto-select-type: true # Replace incompatible armor types with the best type for the server version.
  disable-leather-repair: true # Require copies of the custom armor instead of leather for repairs.

  component:
    auto-assign-component: true # Assign the equippable-model component unless explicitly specified.

  trims:
    material-replacement: CHAINMAIL # Valid options: CHAINMAIL, IRON, GOLD, DIAMOND, NETHERITE, and LEATHER.
    auto-assign-settings: true # Assign the trim and item flag unless explicitly specified.

updater:
  items:
    update-items: true # Update items in player inventories when players join.
    update-tile-entity-contents: true # Update items in loaded block inventories, such as chests and furnaces.
    update-entity-contents: true # Update items held by loaded entities, such as item frames, mobs, and ender chests.
    override-renamed-items: false
    override-item-lore: false # Replace item lore with the lore defined in the item configuration.
    update-on-reload: true # Update online players' items on /oraxen reload items/all.

  furniture:
    update-furniture: true
    update-on-reload: false # Update furniture on /oraxen reload items/all.
    update-on-load: false # Update the furniture item when its entity loads.
    experimental-type-update: false
    experimental-fix-broken: false # Attempt to fix incorrectly placed or broken furniture.

pack:
  generation:
    generate: true # Enable all pack generation, independently of configuration.defaults.assets.
    unprotected-location: "" # Optional readable ZIP before obfuscation. Keep outside plugins/Oraxen/pack.

    mcmeta: true # Generate pack.mcmeta and overlays. Disable to use your own file.

    multi-version-packs: false # Separate packs for 1.20-1.21.3 and 1.21.4+. Requires upload other than self-host.

    model-definitions: true # Use minecraft:item_model on 1.21.4+. Earlier clients use legacy overrides.
    model-data: # 1.21.4+ only. Requires Pack.custom_model_data. Enable at most one option.
      float: false # Select models with custom_model_data.floats[0]. Also sets integer CustomModelData.
      ids: false # Select models with custom_model_data.strings[0] set to oraxen:<item_id>.
    predicates: false # Generate legacy item model overrides on 1.21.4+ for external-tool compatibility.

    fix-force-unicode-glyphs: true # Fix glyphs not displaying when Force Unicode is enabled.
    auto-generated-models-follow-texture-path: false

    atlas:
      generate: true
      type: "SPRITE" # Valid options: "SPRITE" and "DIRECTORY".
      exclude-malformed-from-atlas: true # Exclude malformed textures from the atlas.

  verification: true # Check textures and models for valid resource pack formatting.
  excluded-file-extensions: [] # File extensions excluded from the final ZIP.
  compression: BEST_COMPRESSION # See Deflater.class.

  obfuscation:
    type: NONE # NONE keeps paths readable, SIMPLE renames paths, FULL also renames namespaces.

  comment: "The content of this texture pack
    \nbelongs to the owner of the Oraxen
    \nplugin and any complete or partial
    \nuse must comply with the terms and
    \nconditions of Oraxen."

  import:
    modelengine: true # Import ModelEngine's resource pack when the plugin is enabled.
    merge:
      fonts: true # Merge duplicate font files; exclude originals from the final pack without deleting them.
      duplicates: true
      item-base-models: false # Attempt to merge item base model JSONs, such as paper.json, without generating item configs.

    exclude:
      core-shaders: false # Remove imported Minecraft core shaders from pack/assets and uploads/*.zip merges.

    retain-custom-model-data: true # Keep imported model data during duplicate merging. May conflict with existing items.

  upload:
    enabled: true
    type: polymath # Valid options: lobfile, polymath, s3, self-host, and external.

    polymath:
      server: atlas.oraxen.com # May point to your own Polymath instance.
      secret: "oraxen" # Change this when self-hosting Polymath to restrict uploads.

    lobfile:
      api-key: ""
      pack-name: Oraxen # Uses <pack-name>_<version> for multi-version packs.

    s3:
      endpoint: "https://s3.us-east-1.amazonaws.com" # S3 API endpoint, including https://.
      access-key: ""
      secret-key: ""
      bucket: ""
      region: "us-east-1"
      prefix: "oraxen" # Optional bucket folder; leave empty to use the bucket root.
      path-style: true # Compatible with MinIO, R2, and other S3 APIs; false uses bucket subdomains.
      public-url: "" # Optional public/CDN bucket-root URL, such as https://packs.example.com.
      presigned-url-expiry: 86400 # Seconds (1–604800) when public-url is empty; reload before expiry.

    self-host:
      host: "0.0.0.0" # Bind address; 0.0.0.0 listens on all interfaces.
      port: 8080 # HTTP server port.
      domain: "localhost:8080" # Player-facing domain/IP and port, such as my-server.com:8080.

  dispatch:
    send: true # Send the pack to players.
    mode: "JOIN" # Valid options: PRE-JOIN and JOIN.
    timeout: 30s # Time to wait for a PRE-JOIN response before continuing login.
    exclude: [] # Excluded client versions. Quote rules, such as '< 1.12', '= 1.21.11', or '> 1.21.11'.
    delay: -1
    mandatory: true

    disable: # Temporary restrictions while the pack loads.
      movement: true # Disable movement.
      damage: true # Disable damage.

    prompt: "<#fa4943>Accept the pack to enjoy a full <b><gradient:#9055FF:#13E2DA>Oraxen</b><#fa4943> experience"
    layer: "" # Set a nonempty pack layer to avoid clearing resource packs sent by your proxy.

  receive:
    enabled: true
    loaded:
      actions:
        sound:
          enabled: true # Play the sound when the pack finishes loading.
          type: oraxen:welcome
          volume: 1.0
          pitch: 1.0
        delay: 5 # Delay in ticks.
        message:
          enabled: false
          type: ACTION_BAR # KICK / CHAT / ACTION_BAR / TITLE. Click and hover require CHAT.
          content: "<#55ffa4><bold>ResourcePack loaded"
        commands:
          console: []
          player: []
          opped-player: []

    accepted:
      actions:
        message:
          enabled: false
          type: ACTION_BAR # KICK / CHAT / ACTION_BAR / TITLE. Click and hover require CHAT.
          content: "<#55ffa4><bold>ResourcePack accepted"
        commands:
          console: []
          player: []
          opped-player: []

    denied:
      actions:
        message:
          enabled: false
          type: CHAT # KICK / CHAT / ACTION_BAR / TITLE. Click and hover require CHAT.
          content: "<red>You refused the ResourcePack, but you need it in order to see the new items. Please </red><click:run_command:'/oraxen pack send'><hover:show_text:'<green>Display more information'><green><bold>CLICK HERE</bold></hover></click> <red>or type <bold>/oraxen pack send</bold>"
        commands:
          console: []
          player: []
          opped-player: []

    failed-download:
      actions:
        message:
          enabled: false
          type: CHAT # KICK / CHAT / ACTION_BAR / TITLE. Click and hover require CHAT.
          content: "<red>You failed to download the ResourcePack, but you need it in order to see the new items. Please </red><click:run_command:'/oraxen pack send'><hover:show_text:'<red>Loading the resource pack in game can cause lag'><red><bold>CLICK HERE</bold></hover></click> <red>to retry or type <bold>/oraxen pack send</bold>"
        commands:
          console: []
          player: []
          opped-player: []

    failed-reload: # 1.20.3+ only.
      actions:
        commands:
          console: []
          player: []
          opped-player: []

    downloaded: # 1.20.3+ only.
      actions:
        commands:
          console: []
          player: []
          opped-player: []

    invalid-url: # 1.20.3+ only.
      actions:
        commands:
          console: []
          player: []
          opped-player: []

    discarded: # 1.20.3+ only.
      actions:
        commands:
          console: []
          player: []
          opped-player: []

